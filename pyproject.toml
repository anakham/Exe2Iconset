[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exe2iconset"
version = "0.1.0"
description = "Extract icons from Windows EXE/DLL files and create macOS ICNS files"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Anatoly Khamukhin"}
]
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "pefile>=2023.2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
exe2iconset = "exe2iconset.cli:main"
exe2iconset-gui = "exe2iconset.gui:run_gui"

[project.urls]
Homepage = "https://github.com/anakham/Exe2Iconset"
Repository = "https://github.com/anakham/Exe2Iconset"

[tool.setuptools.packages.find]
where = ["."]