[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exe2iconset"
version = "0.1.1"
description = "Extract icons from Windows EXE/DLL files and create macOS ICNS files"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Anatoly Khamukhin"}
]
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "pefile>=2023.2.7",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "icon", "icns", "macos", "apple", "exe", "dll",
    "windows", "icon-set", "app-icon", "dock-icon",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
exe2iconset = "exe2iconset.cli:main"
exe2iconset-gui = "exe2iconset.gui:run_gui"

[project.urls]
Homepage = "https://github.com/anakham/Exe2Iconset"
Repository = "https://github.com/anakham/Exe2Iconset"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]